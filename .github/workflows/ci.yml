name: verify
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Every job below is blocking: a failing job fails the run. Whether a failing run blocks a merge depends on the
# repository's required status checks (Settings > Branches), which are not in this file.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used to run the real edge Worker against schema.sql) needs >= 22.13
          node-version: '24'
          cache: npm
      - run: npm ci
      # One command, defined once in package.json: shared modules, safety, eslint tripwire,
      # unit + edge tests, signed-routes check, privacy gate, copy lint, docs check.
      - name: verify
        run: npm run verify
      # check:prod-key passes by default (the dev key is fine for demos). Under DOORWAY_PRODUCTION=1 it must REFUSE: this step
      # fails if it does not, so the production guard is itself tested. It must refuse for its own reason, not crash.
      - name: "Production guard refuses the dev key under DOORWAY_PRODUCTION=1 (expected to exit 1)"
        shell: bash
        run: |
          if out=$(DOORWAY_PRODUCTION=1 npm run check:prod-key 2>&1); then
            echo "$out"
            echo 'guard did not refuse the dev key' && exit 1
          fi
          echo "$out"
          grep -q 'refused for DOORWAY_PRODUCTION=1' <<< "$out" || { echo 'guard exited non-zero for another reason' >&2; exit 1; }
      - name: "Prototype e2e specs and TypeScript, linted (typescript-eslint)"
        run: npm run lint:prototype
      - name: Real Workers runtime (workerd + local D1), no account needed
        run: npm run smoke:workerd
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: "End-to-end in Chromium, Firefox and WebKit (hostile host, network record, installer errors, Desk)"
        run: npm run e2e
      # The demo Door (DEMO_ROUTES=1): 'Bel nu', the tel: link, the 'Demo data' chip. The guard test fails if any of them skip.
      - name: "Demo Door panel: verified hours, call button, Demo data (playwright.demo.config.js)"
        run: npm run e2e:demo
      - name: "Prototype: typecheck, build, and its own end-to-end suite (imports the real core)"
        run: |
          npm ci --prefix prototype
          npm --prefix prototype run typecheck
          npm run e2e:prototype
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # A change to packages/shared/.fingerprint.json must come with a dated entry in packages/shared/FINGERPRINT-LOG.md.
  # Needs the base commit, so the checkout is full (fetch-depth 0). Read-only: git diff only.
  fingerprint-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "Shared-module fingerprint changes have a FINGERPRINT-LOG.md entry"
        env:
          FINGERPRINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-fingerprint-log.mjs

  # Every help link in the signed routes bundle must load. Needs the internet; a service being briefly down fails this
  # job on purpose, because a dead "See help" button is the one failure a visitor cannot recover from.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "Every route link loads"
        run: node scripts/check-route-links.mjs

  # The hosted demo: two origins, a real browser, in all three engines. Separate from verify so it runs in parallel.
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: "Hosted demo in Chromium, Firefox and WebKit: two origins, a real browser (the Dockerfile's server)"
        run: npm run e2e:hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-hosted
          path: |
            playwright-report/
            test-results/

  # The image as it is deployed: one image, two roles, two ports, and both must answer before the job passes.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo image
        run: docker build -t doorway-demo .
      - name: Start the Door (ROLE=door) and the platform (ROLE=platform) on two ports
        run: |
          docker run -d --name door -p 8801:8801 \
            -e ROLE=door -e PORT=8801 \
            -e DOOR_ORIGIN=http://127.0.0.1:8801 -e PLATFORM_ORIGIN=http://127.0.0.1:8802 doorway-demo
          docker run -d --name platform -p 8802:8802 \
            -e ROLE=platform -e PORT=8802 \
            -e DOOR_ORIGIN=http://127.0.0.1:8801 -e PLATFORM_ORIGIN=http://127.0.0.1:8802 doorway-demo
      - name: Wait up to 20 s for /health on both containers and /app/ on the platform
        run: |
          wait_for() {
            for i in $(seq 1 40); do
              if curl -fsS --max-time 2 "$1" > /dev/null; then echo "ok: $1"; return 0; fi
              sleep 0.5
            done
            echo "not answering after 20 s: $1" >&2
            return 1
          }
          wait_for http://127.0.0.1:8801/health
          wait_for http://127.0.0.1:8802/health
          wait_for http://127.0.0.1:8802/app/
      # The Door's Desk read model answers with the seeded demo install (inst_demo001, desk token = the public default).
      # GET only: nothing is written. The door runs on 127.0.0.1, so the public-demo guard does not apply.
      - name: "Door Desk read model: GET /v1/agg with the demo token returns 200 and byFormat"
        run: |
          body=$(mktemp)
          code=$(curl -sS --max-time 10 -o "$body" -w '%{http_code}' \
            -H 'Authorization: Bearer desk-demo-token' \
            'http://127.0.0.1:8801/v1/agg?i=inst_demo001')
          echo "status $code"
          if [ "$code" != "200" ]; then cat "$body"; echo; echo '/v1/agg did not answer 200' >&2; exit 1; fi
          grep -q 'byFormat' "$body" || { cat "$body"; echo; echo 'no byFormat in /v1/agg' >&2; exit 1; }
      # The platform serves the loader from its own build, which bakes in the Door origin the job passed. The
      # loader is fetched cross-origin by host pages, so it must answer with access-control-allow-origin: *.
      - name: "Platform loader: GET /dist/latest/doorway.min.js is 200, CORS open, and names the Door origin"
        run: |
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS --max-time 10 -D "$headers" -o "$body" -w '%{http_code}' \
            'http://127.0.0.1:8802/dist/latest/doorway.min.js')
          echo "status $code"
          if [ "$code" != "200" ]; then cat "$headers"; echo '/dist/latest/doorway.min.js did not answer 200' >&2; exit 1; fi
          tr -d '\r' < "$headers" | grep -qi '^access-control-allow-origin: \*$' || { cat "$headers"; echo 'no access-control-allow-origin: *' >&2; exit 1; }
          grep -qF 'http://127.0.0.1:8801' "$body" || { echo 'the loader does not name the Door origin http://127.0.0.1:8801' >&2; exit 1; }
      - name: Container logs (on failure)
        if: failure()
        run: docker logs door; docker logs platform
      - name: Stop the containers
        if: always()
        run: docker rm -f door platform

  # The WordPress plugin inside a real WordPress 7.1 (SQLite, no MySQL), driven by the Playwright suite.
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # PHP for scripts/wp-verify.sh. Pinned by full commit SHA (the tag it points to is v2.40.0).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, zip, curl
      - run: npm ci
      - name: Tools the script needs (zsh runs it, unzip installs the SQLite plugin)
        run: sudo apt-get update && sudo apt-get install -y zsh unzip
      # wp-verify.sh runs wordpress.spec.js in every project of playwright.config.js, so all three browsers are installed.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: "WordPress 7.1 on SQLite with the generated plugin: npm run verify:wordpress"
        run: npm run verify:wordpress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-wordpress
          path: |
            playwright-report/
            test-results/
