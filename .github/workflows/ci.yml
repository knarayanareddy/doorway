name: verify
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used to run the real edge Worker against schema.sql) needs >= 22.13
          node-version: '24'
          cache: npm
      - run: npm ci
      # One command, defined once in package.json: spine, safety, eslint tripwire,
      # unit + edge tests, signed-routes check, privacy gate, copy lint, docs check.
      - name: verify
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (the evidence layer: hostile host, network record, installer errors, Desk)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
