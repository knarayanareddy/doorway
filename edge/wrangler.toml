name = "doorway-edge"
main = "c.js"
compatibility_date = "2026-11-01"

# U8 Hardening: explicitly disable Workers observability and logging so IP
# addresses and client headers are never stored.
logpush = false

[observability]
enabled = false

# D1 database for daily aggregate counts
[[d1_databases]]
binding = "DB"
database_name = "doorway-agg"
database_id = "00000000-0000-0000-0000-000000000000"

# The Door (door.js) is a static asset served from this same Worker, so the Door
# page and the counter share one origin and the Door's CSP can say connect-src 'self'.
[assets]
directory = "../dist/door"
binding = "ASSETS"
run_worker_first = true

[vars]
# The exact origin of this Worker. Writes are accepted only from this origin
# (the sandboxed iframe), never from a platform's own page. No wildcard, no regex.
DOOR_ORIGIN = "https://door.doorway.example"
